<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Two pages, one of them picked out">
  <rect width="32" height="32" rx="6" fill="#1b1a17" />
  <!-- Two pages side by side: the same question, answered twice. -->
  <rect x="5" y="7" width="9" height="18" rx="2" fill="#8a857c" />
  <rect x="18" y="7" width="9" height="18" rx="2" fill="#f6f3ec" />
  <!-- And the one that was picked, marked the way the page marks it. -->
  <rect x="18" y="7" width="2.6" height="18" rx="1.3" fill="#6a5cf0" />
</svg>
